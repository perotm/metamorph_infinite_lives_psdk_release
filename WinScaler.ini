[Settings]
; Name (or full path) of the executable to launch.
; If relative, it is resolved from this exe's folder.
GameExe=Game.exe

; 0 = windowed/maximized mode stays at the game's
;     native resolution, centered, no upscale.
; 1 = the game is upscaled according to ScaleMode,
;     centered, following the host window's resize
;     / maximize dynamically.
WindowedUpscale=1

; Maximum scale applied in fake fullscreen and in
; windowed upscale. Lower this on a large screen if
; you want to cap how much the game gets enlarged.
; 0 = unlimited (the largest scale that fits).
MaxUpscale=0

; Game scaling mode, used in fake fullscreen
; (Alt+Enter) and in windowed upscale
; (WindowedUpscale=1):
;   LetterBox = INTEGER scale (x1,x2,x3...), centered,
;               black bars, pixel-perfect.
;   Stretch   = fills all available space, stretches
;               the image, ignores aspect ratio.
;   Fit       = floating-point scale, keeps aspect
;               ratio, fills as much as possible,
;               minimal bars.
ScaleMode=Fit

; Real native resolution of the game. Forces this value
; instead of auto-detection. Useful if the game (a
; separate process, not necessarily DPI-aware) reports
; a slightly wrong size once read from this host, which
; would throw off the LetterBox integer scale
; calculation. 0 = auto-detect.
NativeWidth=1280
NativeHeight=960
